# What the list says about each item beyond its manifest; scripts/check-index.py --repo .
# checks it. See docs/publishing.md.
#   categories   1 to 3 of: coding review testing security research writing data devops
#                design productivity devices communication
#   tags         up to 8, a-z, 0-9 and -
#   screenshots  optional, up to 8: [{file, caption}], files in screenshots/<item>/
# A plugin also names its `author`, `license` (SPDX) and `source` (https) here; a pack
# has them in its pack.yml as `vendor`, `license` and `upstream`.
# A connector names the same three here, beside its connectors/<name>/connector.yml
# (docs/connectors.md).
# No badge and no stars: the badge follows from the author (Official for duskcode's own
# work, Verified for anybody else's), and stars are not the item's.
plugins:
  ios-simulator:
    author: duskcode
    license: MIT
    source: https://github.com/DroBov1Tya/duskcode-workshop/tree/main/plugins/ios-simulator
    categories: [devices, testing]
    tags: [ios, simulator, xcode, panel]
  telegram:
    author: duskcode
    license: MIT
    source: https://github.com/DroBov1Tya/duskcode-workshop/tree/main/plugins/telegram
    categories: [communication]
    tags: [telegram, bot, remote]
  vphone:
    author: duskcode
    license: MIT
    source: https://github.com/DroBov1Tya/duskcode-workshop/tree/main/plugins/vphone
    categories: [devices, testing]
    tags: [ios, virtual-device, panel]
packs:
  duskcode-engineering:
    categories: [coding, testing]
    tags: [design, debugging, testing]
    screenshots:
      - {file: 1-pack.webp, caption: "pack.yml: the six skills of the pack"}
      - {file: 2-skills.webp, caption: "What each skill is for, from its SKILL.md"}
      - {file: 3-debugging.webp, caption: "The start of the systematic-debugging skill"}
  duskcode-security:
    categories: [security]
    tags: [pentest, assessment, appsec]
    screenshots:
      - {file: 1-skills.webp, caption: "What each assessment skill is for, from its SKILL.md"}
      - {file: 2-web.webp, caption: "The start of the web-security-assessment skill"}
  duskcode-engineering-agents: {categories: [coding, devops], tags: [agents, architecture, backend, devops]}
  duskcode-mobile-agents: {categories: [coding], tags: [agents, android, ios, mobile]}
  duskcode-testing-agents: {categories: [testing, review], tags: [agents, qa, review, accessibility]}
  duskcode-security-agents: {categories: [security], tags: [agents, pentest, appsec, red-team]}
  web-builder-skills: {categories: [design, coding, testing], tags: [frontend, mcp, web]}
  dev-workflow-skills: {categories: [review, testing, security], tags: [github, ci, playwright, notebooks]}
  gpu-computing-skills: {categories: [coding, data], tags: [cuda, gpu, dataframes]}
  # Pinned in their author's repository (pinned/<pack>): pack.yml and pins.json there.
  office-document-skills: {categories: [writing, data, productivity], tags: [docx, pdf, slides, spreadsheets]}
  visual-design-skills: {categories: [design], tags: [generative-art, posters, themes, gif]}
  communication-skills: {categories: [writing, communication], tags: [status-reports, newsletters, review]}
  hosting-deploy-skills: {categories: [devops], tags: [deploy, hosting, preview]}
  team-workspace-skills: {categories: [productivity, communication], tags: [issues, errors, wiki, meetings]}
  dotnet-app-skills: {categories: [coding], tags: [dotnet, web, desktop, csharp]}
  speech-audio-skills: {categories: [data, productivity], tags: [speech, transcription, audio]}
  repository-utility-skills: {categories: [coding, security], tags: [git, pull-requests, screenshots, pdf]}
  tile-kernel-skills: {categories: [coding], tags: [gpu, kernels, triton, autotuning]}
  gpu-simulation-skills: {categories: [coding, research], tags: [gpu, simulation, gradients]}
  multi-gpu-memory-skills: {categories: [coding, devops], tags: [gpu, multi-node, networking, performance]}
  optimization-solver-skills: {categories: [data, coding], tags: [optimization, routing, solver, gpu]}
